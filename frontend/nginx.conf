server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 12m;

    # /api/* -> FastAPI (the trailing slash strips the /api prefix).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        # The optimize loop runs several LLM calls in sequence; with a local model that takes minutes.
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location / {
        try_files $uri /index.html;
    }
}
